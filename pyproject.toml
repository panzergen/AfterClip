[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "afterclip"
dynamic = ["version"]
description = "Windows-first local media transcription desktop application"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "AfterClip contributors" }]
keywords = [
    "transcription",
    "whisper",
    "subtitles",
    "speech-to-text",
    "pyside6",
    "qml",
    "ffmpeg",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Win32 (MS Windows)",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: End Users/Desktop",
    "Natural Language :: English",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS :: MacOS X",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
    "Topic :: Multimedia :: Video",
]
dependencies = ["PySide6>=6.7", "keyring>=25.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.6"]
build = ["pyinstaller>=6.10"]
mcp = ["mcp>=1.0,<2"]
voiceprint = ["onnxruntime>=1.17", "speakeronnx>=0.3"]

[tool.setuptools.dynamic]
version = { attr = "app.version.__version__" }

[project.urls]
Homepage = "https://github.com/panzergen/AfterClip"
Repository = "https://github.com/panzergen/AfterClip"
Issues = "https://github.com/panzergen/AfterClip/issues"

[project.scripts]
afterclip = "app.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"app.ui.qml" = ["*.qml"]
"app.ui.qml.components" = ["*.qml", "qmldir"]
"app.ui.assets" = ["*.wav"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = ["ui: Qt UI tests; opt in with -m ui (deselected by default)"]
addopts = "-m 'not ui'"

[tool.coverage.run]
source = ["app"]
omit = ["app/ui/*", "app/main.py"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "N", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.pep8-naming]
# Domain exceptions use descriptive nouns instead of the "Error" suffix; the
# names read better at the call site and renaming them would churn the API.
ignore-names = [
    "CloudPolicyViolation",
    "GeminiKeyMissing",
    "JobCancelled",
    "ProcessingCancelled",
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*" = ["N802", "N806"]
# Qt QML properties/signals must be camelCase (N815); Qt methods keep snake_case (N802)
"src/app/ui/**/*" = ["N815", "N802"]
