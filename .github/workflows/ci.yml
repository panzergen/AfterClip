name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ruff
        run: python -m pip install --upgrade pip ruff
      - name: ruff check
        run: python -m ruff check src tests packaging
      - name: ruff format --check
        run: python -m ruff format --check src tests packaging

  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install the package and test dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"
      - name: Unit and regression tests
        run: python -m pytest -q
      - name: UI tests (offscreen)
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -m ui -q
      - name: Coverage
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        run: python -m pytest --cov=app --cov-report=xml --cov-report=term
      - name: Upload coverage
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.xml
          if-no-files-found: ignore

  package:
    name: Build the wheel and sdist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build tooling
        run: python -m pip install --upgrade pip build
      - name: Build
        run: python -m build
      - name: Check that the sdist ships the QML tree and the bundled chime
        run: |
          set -euo pipefail
          python - <<'PY'
          import tarfile, pathlib, sys
          sdists = list(pathlib.Path("dist").glob("*.tar.gz"))
          assert sdists, "no sdist was produced"
          with tarfile.open(sdists[0]) as tar:
              names = tar.getnames()
          required = [
              "src/app/ui/qml/components/qmldir",
              "src/app/ui/assets/complete.wav",
              "LICENSE",
          ]
          missing = [r for r in required if not any(n.endswith(r) for n in names)]
          if missing:
              sys.exit(f"sdist is missing required files: {missing}")
          print("sdist contents look correct")
          PY
      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: distributions
          path: dist/
