[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "afterclip"
version = "0.1.0"
description = "Windows-first local media transcription desktop application"
requires-python = ">=3.12"
dependencies = ["PySide6>=6.7", "keyring>=25.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0"]

[project.urls]
Homepage = "https://github.com/panzergen/AfterClip"
Repository = "https://github.com/panzergen/AfterClip"
Issues = "https://github.com/panzergen/AfterClip/issues"

[project.scripts]
afterclip = "app.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"app.ui.qml" = ["*.qml", "qmldir"]
"app.ui.qml.components" = ["*.qml"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = ["ui: Qt UI tests; opt in with -m ui (deselected by default)"]
addopts = "-m 'not ui'"

[tool.coverage.run]
source = ["app"]
omit = ["app/ui/*", "app/main.py"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "N", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*" = ["N802", "N806"]
# Qt QML properties/signals must be camelCase (N815); Qt methods keep snake_case (N802)
"src/app/ui/**/*" = ["N815", "N802"]
