[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "afterclip"
version = "0.1.0"
description = "Windows-first local media transcription desktop application"
requires-python = ">=3.12"
dependencies = ["PySide6>=6.7", "keyring>=25.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
afterclip = "app.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
